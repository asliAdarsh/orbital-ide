[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-backend"
version = "0.1.0"
description = "Agent runtime for the Orbital IDE: FastAPI + LangGraph over a 5-phase build pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "websockets==16.1.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "langchain==1.4.0",
    "langchain-core==1.6.2",
    "langchain-openai==1.6.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "watchfiles==1.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools]
packages = ["orbital_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:langgraph.*"]
